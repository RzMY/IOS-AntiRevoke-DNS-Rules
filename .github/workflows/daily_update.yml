name: Daily iOS Anti-Revoke Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: Enable debug logging
        required: false
        default: false
        type: boolean

concurrency:
  group: daily-ios-antirevoke-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Run discovery and generation pipeline
        env:
          DEBUG_MODE: ${{ inputs.debug || false }}
        run: |
          if [ "$DEBUG_MODE" = "true" ]; then
            python main.py --debug
          else
            python main.py
          fi

      - name: Validate generated artifacts
        run: |
          test -s output/RevokeGuard_Auto-Sync.mobileconfig
          test -s output/RevokeGuard_QuantumultX.txt
          test -s output/RevokeGuard_Surge.txt
          test -s output/RevokeGuard_Loon.txt
          test -s output/RevokeGuard_Shadowrocket.txt
          test -s output/RevokeGuard_hosts.txt
          test -s output/domains.txt
          test -s output/metadata.json
          test ! -e output/enhanced/RevokeGuard_Enhanced.mobileconfig
          test -s output/enhanced/RevokeGuard_Enhanced_QuantumultX.txt
          test -s output/enhanced/RevokeGuard_Enhanced_Surge.txt
          test -s output/enhanced/RevokeGuard_Enhanced_Loon.txt
          test -s output/enhanced/RevokeGuard_Enhanced_Shadowrocket.txt
          test -s output/enhanced/RevokeGuard_Enhanced_hosts.txt
          test -s output/enhanced/enhanced-domains.txt
          test -s output/enhanced/metadata.json
          python - <<'PY'
          import plistlib
          from pathlib import Path

          path = Path("output/RevokeGuard_Auto-Sync.mobileconfig")
          with path.open("rb") as file_handle:
              profile = plistlib.load(file_handle)
          assert profile["PayloadType"] == "Configuration"
          assert profile["PayloadIdentifier"] == "com.revokeGuard"
          normal, enhanced = profile["PayloadContent"]
          for mode, payload in (("normal", normal), ("enhanced", enhanced)):
              assert payload["PayloadType"] == "com.apple.dnsSettings.managed"
              assert payload["PayloadIdentifier"] == f"com.revokeGuard.dns.{mode}"
              assert payload["DNSSettings"]["DNSProtocol"] == "HTTPS"
              assert payload["DNSSettings"]["ServerURL"].startswith("https://")
          assert normal["PayloadUUID"] != enhanced["PayloadUUID"]
          def read_domains(path):
              return {
                  line.strip() for line in Path(path).read_text().splitlines()
                  if line.strip() and not line.startswith("#")
              }
          normal_domains = read_domains("output/domains.txt")
          extra_domains = read_domains("output/enhanced/enhanced-domains.txt")
          assert normal_domains
          assert set(normal["DNSSettings"]["SupplementalMatchDomains"]) == normal_domains
          assert set(enhanced["DNSSettings"]["SupplementalMatchDomains"]) == normal_domains | extra_domains
          assert "ppq.apple.com" not in normal_domains
          print("Generated mobileconfig contains valid normal and enhanced DNS payloads")
          PY

      - name: Check for output changes
        id: changes
        run: |
          git add output/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push output changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: update iOS Anti-Revoke rules"
          git push

      - name: Upload generated artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-antirevoke-rules
          path: output/
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          echo "## iOS Anti-Revoke Update" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/metadata.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          with open("output/metadata.json", encoding="utf-8") as file_handle:
              data = json.load(file_handle)

          print(f"- Apple candidates: {data['apple_source']['candidate_domains']}")
          print(f"- Normal target domains: {data['normal_discovery']['target_domains']}")
          print(f"- Enhanced extra domains: {data['enhanced_discovery']['extra_domains']}")
          print(f"- Enhanced profile domains: {data['enhanced_discovery']['merged_profile_domains']}")
          PY
          fi
